<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ORÁCULO // REINOS DO SABER</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: #111622;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.4);
      --player-hp: #00ff88;
      --boss-hp: #ff0055;
      --warning: #f59e0b;
      --border: #232d42;
      --text: #e2e8f0;
      --pixel-font: 'Press Start 2P', monospace;
      --ui-font: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui-font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    /* BARRA SUPERIOR DE RECURSOS */
    .top-hud {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .hud-chip { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.9rem; }
    .hud-chip span { color: var(--accent); }

    /* TELAS (VIEWPORT NAVEGÁVEL) */
    .view-screen {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hidden { display: none !important; }

    /* ECRÃ 1: MAPA DOS REINOS / HUB */
    .realm-title {
      font-family: var(--pixel-font);
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
      margin: 6px 0;
      letter-spacing: 1px;
    }

    .realms-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .realm-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .realm-card:active { transform: scale(0.98); }
    .realm-card:hover { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
    .realm-icon { font-size: 2.2rem; }
    .realm-info { flex: 1; }
    .realm-name { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .realm-desc { font-size: 0.8rem; color: #94a3b8; line-height: 1.3; margin-bottom: 6px; }
    .realm-progress-bar {
      width: 100%; height: 6px; background: #1a2233; border-radius: 3px; overflow: hidden;
    }
    .realm-progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

    /* ECRÃ 2: ARENA DE COMBATE */
    .arena-box {
      background: radial-gradient(circle at center, #1b2438 0%, #080a12 100%);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      position: relative;
    }
    .shake { animation: shake 0.25s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .status-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .bar-wrap { width: 48%; }
    .bar-label { font-family: var(--pixel-font); font-size: 0.55rem; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .bar-bg { width: 100%; height: 10px; background: #1c2436; border-radius: 3px; overflow: hidden; border: 1px solid #334155; }
    .bar-fill { height: 100%; transition: width 0.3s; }

    .duel-stage {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0;
    }
    .fighter { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .fighter-sprite { font-size: 3rem; transition: transform 0.2s; }
    .boss-glow { filter: drop-shadow(0 0 12px rgba(255,0,85,0.6)); font-size: 3.4rem; }
    .hit-flash { filter: brightness(3) saturate(0) !important; }

    .boss-bubble {
      background: #0d121c;
      border: 1px solid #28354d;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.92rem;
      line-height: 1.4;
      margin-top: 6px;
    }

    /* INVENTÁRIO DE FOCO */
    .inventory-bar {
      display: flex;
      gap: 8px;
      margin: 4px 0;
    }
    .btn-item {
      flex: 1;
      background: #192233;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-item:active { transform: scale(0.95); }
    .btn-item.disabled { opacity: 0.4; pointer-events: none; }

    /* DECK DE GOLPES */
    .deck { display: flex; flex-direction: column; gap: 8px; }
    .btn-strike {
      background: #121824;
      border: 1px solid #23304a;
      border-radius: 8px;
      padding: 12px 14px;
      color: #f1f5f9;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-strike:active { transform: scale(0.98); background: #1c2638; border-color: var(--accent); }
    .btn-strike.hidden-action { display: none !important; }

    /* FOOTER CONTROLS */
    .bottom-nav {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }
    .btn-nav {
      flex: 1;
      padding: 10px;
      background: #1c2436;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-family: var(--ui-font);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- STATUS HUD -->
  <div class="top-hud">
    <div class="hud-chip">LV. <span id="hud-level">1</span></div>
    <div class="hud-chip">💎 <span id="hud-xp">0</span> XP</div>
    <div class="hud-chip">⚡ STREAK <span id="hud-streak" style="color:var(--player-hp)">0x</span></div>
  </div>

  <!-- VIEW 1: SELETOR DE MUNDOS / HUB -->
  <div class="view-screen" id="screen-hub">
    <div class="realm-title">ESCOLHA SEU REINO DE TREINAMENTO</div>
    <div class="realms-grid" id="realms-list"></div>
  </div>

  <!-- VIEW 2: ARENA DE BATALHA -->
  <div class="view-screen hidden" id="screen-battle">
    <div class="arena-box" id="arena">
      <div class="status-row">
        <div class="bar-wrap">
          <div class="bar-label"><span>VOCÊ</span><span id="txt-player-hp">100/100</span></div>
          <div class="bar-bg"><div class="bar-fill" id="fill-player-hp" style="background:var(--player-hp); width:100%;"></div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-label"><span id="txt-boss-name">BOSS</span><span id="txt-boss-hp">100/100</span></div>
          <div class="bar-bg"><div class="bar-fill" id="fill-boss-hp" style="background:var(--boss-hp); width:100%;"></div></div>
        </div>
      </div>

      <div class="duel-stage">
        <div class="fighter">
          <div class="fighter-sprite" id="sprite-player">🥋</div>
        </div>
        <div style="font-family:var(--pixel-font); font-size:0.9rem; color:#ff0055;">VS</div>
        <div class="fighter">
          <div class="fighter-sprite boss-glow" id="sprite-boss">👹</div>
        </div>
      </div>

      <div class="boss-bubble" id="boss-challenge">Carregando enigma...</div>
    </div>

    <!-- INVENTÁRIO DE FOCO PARA TDAH -->
    <div class="inventory-bar">
      <button class="btn-item" id="btn-potion" onclick="usePotion()">🧪 Olho Crítico (<span id="potion-count">2</span>)</button>
      <button class="btn-item" onclick="fleeToHub()">🗺️ Abandonar Duelo</button>
    </div>

    <!-- AÇÕES DE GOLPE -->
    <div class="deck" id="strike-deck"></div>
  </div>

  <script>
    /* =========================================================================
       CREDENCIAS DO SUPABASE (CONFIGURADAS)
       ========================================================================= */
    const SUPABASE_URL = "https://aazdwdbmmvokborisuxd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TVwbt5bsVssBt7h4oSAe6Q_JzaJ1p4X";
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* ÁUDIO NATIVO RETRÔ PARA IOS (SEM DEPENDÊNCIA EXTERNA) */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSfx(freq1, freq2, type = 'square', duration = 0.15) {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      osc.type = type;
      osc.frequency.setValueAtTime(freq1, t);
      osc.frequency.exponentialRampToValueAtTime(freq2, t + duration);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.linearRampToValueAtTime(0.01, t + duration);
      osc.start(t); osc.stop(t + duration);
    }

    /* BASE DE DADOS ORGANIZADA POR REINOS */
    const REINOS = [
      {
        id: "filosofia",
        name: "Cidadela da Filosofia",
        desc: "Epistemologia Socrática, Crítica Nietzscheana, Poder Foucaultiano e Descartes.",
        icon: "🏛️",
        bosses: [
          {
            name: "Devoir Cartesiano",
            sprite: "🧊",
            challenge: "Descartes duvida das certezas sensíveis para refundar o saber. Qual ação quebra a ilusão?",
            options: [
              { text: "Ativar Dúvida Metódica: Rejeitar antigas opiniões até achar algo firme.", type: "crit" },
              { text: "Fundamentar as ciências na evidência absoluta dos sentidos humanos.", type: "almost" },
              { text: "Concluir que toda verdade científica é rigorosamente impossível.", type: "fail" }
            ]
          },
          {
            name: "Oráculo Socrático",
            sprite: "📜",
            challenge: "Na epistemologia grega, o que verdadeiramente instiga o início do conhecimento?",
            options: [
              { text: "A consciência da própria ignorância e o 'Conhece-te a ti mesmo'.", type: "crit" },
              { text: "A aceitação da Doxa como sinónimo de conhecimento racional supremo.", type: "almost" },
              { text: "A constatação da incapacidade humana irremediável de pensar.", type: "fail" }
            ]
          },
          {
            name: "Sentinela de Foucault",
            sprite: "👁️",
            challenge: "Como a microfísica de Michel Foucault define o poder nas instituições modernas?",
            options: [
              { text: "Rede Capilar e Produtiva: Que dissemina saber, prazer e discursos.", type: "crit" },
              { text: "Apenas um aparelho centralizado estatal que dita restrições e proibições.", type: "almost" },
              { text: "Um mecanismo restrito exclusivamente à criação estética de conceitos.", type: "fail" }
            ]
          }
        ]
      },
      {
        id: "programacao_c",
        name: "Fortaleza de Sistemas & C",
        desc: "Arquitetura Von Neumann, Manipulação de Registros fopen, Recursividade e Memória.",
        icon: "⚡",
        bosses: [
          {
            name: "Guardião de Ficheiros",
            sprite: "💾",
            challenge: "Auditoria ininterrupta: Gravar e consultar registros sem apagar histórico prévio no fopen():",
            options: [
              { text: "Modo 'r+': Abertura para leitura e escrita preservando os dados existentes.", type: "crit" },
              { text: "Modo 'w+': Leitura e escrita completa reiniciando o arquivo a zero.", type: "almost" },
              { text: "Modo 'a': Para ler e gravar ao mesmo tempo no início do ficheiro.", type: "fail" }
            ]
          },
          {
            name: "Espectro Recursivo",
            sprite: "🌀",
            challenge: "Chamadas sucessivas ameaçam a memória da Stack! Como deter o Stack Overflow?",
            options: [
              { text: "Condição-Base de Parada: Encerrar a auto-invocação no caso trivial.", type: "crit" },
              { text: "Substituição forçada de todos os laços e ponteiros do programa.", type: "almost" },
              { text: "Duplicação contínua da pilha de chamadas da CPU.", type: "fail" }
            ]
          },
          {
            name: "Titã de Von Neumann",
            sprite: "⚙️",
            challenge: "Quais são os três subsistemas nucleares internos da CPU clássica?",
            options: [
              { text: "Registradores + Unidade de Controle (UC) + ULA.", type: "crit" },
              { text: "Registradores + Barramento de Dados + Memória Cache L1.", type: "almost" },
              { text: "Buffers de Entrada + Memória Virtual + Placa Mãe.", type: "fail" }
            ]
          }
        ]
      },
      {
        id: "metodologia",
        name: "Templo da Metodologia & Análise",
        desc: "Estruturas de Dados FIFO, Gênero Ensaio Acadêmico e Algoritmos de Laço.",
        icon: "📚",
        bosses: [
          {
            name: "Mestre da Escrita Crítica",
            sprite: "🖋️",
            challenge: "Segundo a prática acadêmica (Carmo, 2021), quais são os traços do gênero ensaio?",
            options: [
              { text: "Hibridização, temporalidade e independência autoral.", type: "crit" },
              { text: "Hibridização, dependência estrita e restrição investigativa.", type: "almost" },
              { text: "Mera reprodução acrítica e restrição metodológica.", type: "fail" }
            ]
          },
          {
            name: "Autómato das Filas",
            sprite: "📦",
            challenge: "Qual a propriedade estrutural inegociável da estrutura de dados FILA (Queue)?",
            options: [
              { text: "Acesso de entrada em um extremo e saída estritamente pelo outro (FIFO).", type: "crit" },
              { text: "Inserção e remoção no mesmo extremo seguindo o protocolo LIFO.", type: "almost" },
              { text: "Inserção e remoção no centro arbitrário através de vetores fixos.", type: "fail" }
            ]
          }
        ]
      }
    ];

    /* ESTADO DO JOGADOR */
    let player = {
      level: 1,
      xp: 0,
      streak: 0,
      potions: 2,
      progress: { filosofia: 0, programacao_c: 0, metodologia: 0 }
    };

    let activeRealm = null;
    let activeBossIdx = 0;
    let playerHP = 100;
    let bossHP = 100;

    function renderHub() {
      document.getElementById('screen-hub').classList.remove('hidden');
      document.getElementById('screen-battle').classList.add('hidden');

      const list = document.getElementById('realms-list');
      list.innerHTML = '';

      REINOS.forEach(r => {
        const total = r.bosses.length;
        const current = player.progress[r.id] || 0;
        const pct = Math.min(100, Math.round((current / total) * 100));

        const card = document.createElement('div');
        card.className = 'realm-card';
        card.innerHTML = `
          <div class="realm-icon">${r.icon}</div>
          <div class="realm-info">
            <div class="realm-name">${r.name}</div>
            <div class="realm-desc">${r.desc}</div>
            <div class="realm-progress-bar">
              <div class="realm-progress-fill" style="width:${pct}%"></div>
            </div>
            <div style="font-size:0.75rem; color:#38bdf8; margin-top:4px;">Domínio: ${pct}% (${current}/${total} Conquistados)</div>
          </div>
        `;
        card.onclick = () => startRealm(r);
        list.appendChild(card);
      });

      updateHUD();
    }

    function startRealm(realm) {
      activeRealm = realm;
      activeBossIdx = player.progress[realm.id] >= realm.bosses.length ? 0 : player.progress[realm.id];
      document.getElementById('screen-hub').classList.add('hidden');
      document.getElementById('screen-battle').classList.remove('hidden');
      initCombat();
    }

    function initCombat() {
      const boss = activeRealm.bosses[activeBossIdx];
      playerHP = 100;
      bossHP = 100;
      updateCombatBars();

      document.getElementById('txt-boss-name').innerText = boss.name.toUpperCase();
      document.getElementById('sprite-boss').innerText = boss.sprite;
      document.getElementById('boss-challenge').innerText = boss.challenge;
      document.getElementById('potion-count').innerText = player.potions;

      const deck = document.getElementById('strike-deck');
      deck.innerHTML = '';

      // Embaralhar ações
      const acts = [...boss.options].sort(() => Math.random() - 0.5);

      acts.forEach(a => {
        const btn = document.createElement('button');
        btn.className = 'btn-strike';
        btn.dataset.type = a.type;
        btn.innerHTML = `<span>⚔️</span> <span>${a.text}</span>`;
        btn.onclick = () => strike(a, btn);
        deck.appendChild(btn);
      });
    }

    function strike(action, btnElement) {
      const arena = document.getElementById('arena');
      const bossSprite = document.getElementById('sprite-boss');
      const playerSprite = document.getElementById('sprite-player');

      if (action.type === 'crit') {
        bossHP = Math.max(0, bossHP - 60);
        bossSprite.classList.add('hit-flash');
        playSfx(520, 200, 'square', 0.2);
        player.xp += 40 + (player.streak * 5);
        player.streak += 1;
        setTimeout(() => bossSprite.classList.remove('hit-flash'), 250);
      } else if (action.type === 'almost') {
        bossHP = Math.max(0, bossHP - 15);
        playerHP = Math.max(0, playerHP - 25);
        arena.classList.add('shake');
        playSfx(140, 60, 'sawtooth', 0.3);
        player.streak = 0;
        setTimeout(() => arena.classList.remove('shake'), 250);
      } else {
        playerHP = Math.max(0, playerHP - 40);
        arena.classList.add('shake');
        playerSprite.classList.add('hit-flash');
        playSfx(100, 40, 'sawtooth', 0.35);
        player.streak = 0;
        setTimeout(() => {
          arena.classList.remove('shake');
          playerSprite.classList.remove('hit-flash');
        }, 250);
      }

      updateCombatBars();
      updateHUD();

      if (bossHP <= 0) {
        playSfx(300, 600, 'triangle', 0.4);
        if (activeBossIdx + 1 > player.progress[activeRealm.id]) {
          player.progress[activeRealm.id] = activeBossIdx + 1;
        }
        syncProgress();
        setTimeout(() => {
          if (activeBossIdx + 1 < activeRealm.bosses.length) {
            activeBossIdx++;
            initCombat();
          } else {
            alert(`🎉 REINO CONQUISTADO! Você completou ${activeRealm.name}!`);
            renderHub();
          }
        }, 700);
      } else if (playerHP <= 0) {
        playSfx(80, 40, 'sawtooth', 0.5);
        alert("💀 Derrota tática! Reorganize a sua mente e tente de novo.");
        initCombat();
      }
    }

    function usePotion() {
      if (player.potions <= 0) return;
      // Procura a opção quase certa ou falha e remove da tela
      const buttons = document.querySelectorAll('.btn-strike');
      for (let b of buttons) {
        if (b.dataset.type === 'almost' || b.dataset.type === 'fail') {
          b.classList.add('hidden-action');
          break;
        }
      }
      player.potions--;
      document.getElementById('potion-count').innerText = player.potions;
      playSfx(400, 800, 'sine', 0.15);
    }

    function fleeToHub() {
      renderHub();
    }

    function updateCombatBars() {
      document.getElementById('fill-player-hp').style.width = playerHP + '%';
      document.getElementById('fill-boss-hp').style.width = bossHP + '%';
      document.getElementById('txt-player-hp').innerText = `${playerHP}/100`;
      document.getElementById('txt-boss-hp').innerText = `${bossHP}/100`;
    }

    function updateHUD() {
      document.getElementById('hud-xp').innerText = player.xp;
      document.getElementById('hud-streak').innerText = `${player.streak}x`;
      player.level = Math.floor(player.xp / 120) + 1;
      document.getElementById('hud-level').innerText = player.level;
    }

    async function syncProgress() {
      try {
        await sbClient.from('oraculo_progress').upsert({
          user_id: 'amanda_anshiran',
          level: player.level,
          xp: player.xp,
          streak: player.streak,
          weaknesses: player.progress,
          updated_at: new Date().toISOString()
        });
      } catch (err) {
        console.warn("Supabase auto-save:", err);
      }
    }

    // Inicialização
    renderHub();
  </script>
</body>
</html>
