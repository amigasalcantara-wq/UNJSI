<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ORÁCULO RPG // Protocolo Maestria</title>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts: Estética Arcade & Cyberpunk Limpa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151922;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.35);
      --success: #00ff88;
      --danger: #ff0055;
      --warning: #ffb703;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #232b3e;
      --font-code: 'Fira Code', monospace;
      --font-title: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-code);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* Status Bar RPG Superior */
    .hud {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .hud-stat { display: flex; flex-direction: column; font-size: 0.8rem; }
    .hud-val { font-family: var(--font-title); font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .xp-bar-container {
      width: 100%;
      max-width: 680px;
      height: 8px;
      background: #1c2333;
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .xp-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      transition: width 0.4s ease;
    }

    /* Cartão Principal de Desafio */
    .quest-card {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      position: relative;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .badge-sector {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(0, 242, 254, 0.1);
      color: var(--accent);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
      border: 1px solid var(--accent-glow);
    }

    .quest-question {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 16px;
      font-weight: 600;
      color: #f8fafc;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-option {
      background: #1a202c;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 12px 14px;
      font-family: var(--font-code);
      font-size: 0.85rem;
      line-height: 1.4;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .btn-option:hover {
      background: #242c3d;
      border-color: var(--accent);
    }
    .btn-option.selected {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .btn-option.correct {
      background: rgba(0, 255, 136, 0.15) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
    }
    .btn-option.wrong {
      background: rgba(255, 0, 85, 0.15) !important;
      border-color: var(--danger) !important;
      color: var(--danger) !important;
    }
    .btn-option.almost {
      border-color: var(--warning) !important;
      background: rgba(255, 183, 3, 0.1) !important;
    }

    /* Caixa de Explicação Neuro-Adaptativa */
    .analysis-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 8px;
      background: #0f131a;
      border-left: 4px solid var(--accent);
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .analysis-box h4 {
      font-family: var(--font-title);
      font-size: 1.1rem;
      margin-bottom: 6px;
    }
    .analysis-box p {
      font-size: 0.8rem;
      line-height: 1.45;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .analysis-box .trap-alert {
      color: var(--warning);
      font-weight: 600;
    }

    .action-controls {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .btn-action {
      flex: 1;
      padding: 12px;
      background: var(--accent);
      color: #0b0e14;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-title);
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: opacity 0.2s ease;
    }
    .btn-action:hover { opacity: 0.9; }

    /* Painel de Fraquezas & Sincronização */
    .drawer {
      width: 100%;
      max-width: 680px;
      margin-top: 16px;
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 12px 16px;
    }
    .drawer-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }
    .weakness-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
    }
    .weakness-item {
      font-size: 0.75rem;
      background: #1c2333;
      padding: 6px 10px;
      border-radius: 4px;
      border-left: 3px solid var(--danger);
      display: flex;
      justify-content: space-between;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- HUD STATUS BAR -->
  <div class="hud">
    <div class="hud-stat">
      <span>NÍVEL</span>
      <span class="hud-val" id="player-level">LV. 1</span>
    </div>
    <div class="hud-stat">
      <span>XP ACUMULADO</span>
      <span class="hud-val" id="player-xp">0 XP</span>
    </div>
    <div class="hud-stat">
      <span>COMBO DOPAMINA</span>
      <span class="hud-val" id="player-streak" style="color:var(--success);">0x</span>
    </div>
  </div>

  <!-- BARRA DE PROGRESSO DINÂMICA -->
  <div class="xp-bar-container">
    <div class="xp-bar" id="xp-fill"></div>
  </div>

  <!-- ARENA DA QUESTÃO -->
  <div class="quest-card" id="card">
    <div class="badge-sector" id="quest-module">MÓDULO</div>
    <div class="quest-question" id="quest-title">Carregando desafio...</div>
    <div class="options-grid" id="quest-options"></div>

    <!-- ANÁLISE / NEURO-FEEDBACK -->
    <div class="analysis-box" id="analysis">
      <h4 id="analysis-title">DIAGNÓSTICO</h4>
      <p id="analysis-text"></p>
      <p class="trap-alert" id="analysis-trap"></p>
    </div>

    <div class="action-controls">
      <button class="btn-action" id="btn-next" onclick="nextQuestion()">Próximo Desafio &rarr;</button>
    </div>
  </div>

  <!-- RADAR DE VULNERABILIDADES (TDAH Tracker) -->
  <div class="drawer">
    <div class="drawer-title" onclick="toggleWeaknesses()">
      <span>🚨 Radar de Fraquezas & Armadilhas</span>
      <span id="weakness-count">0 Alertas</span>
    </div>
    <div class="weakness-list" id="weakness-container"></div>
  </div>

        rationale: "A classe é o molde (blueprint) definindo atributos (estado) e métodos (comportamento).",
        trap: "Troca Hierárquica: Objeto é instância de Classe, nunca de método."
      },
      {
        id: "Q1151793",
        sector: "Algoritmos // Laços de Repetição",
        question: "Qual o resultado do algoritmo: 'para x de 10 ate 1 passo -1 faca escreval(x)'?",
        options: [
          "Escreve os números pares entre 1 até 10 em ordem decrescente.",
          "Escreve os números de 1 até 10 em ordem decrescente.",
          "Escreve os números ímpares de 1 até 10 em ordem decrescente.",
          "Escreve os números de 1 até 10 em ordem crescente.",
          "Escreve um número x digitado dez vezes."
        ],
        correct: 1,
        distractor: 0,
        rationale: "Com passo -1 iniciando em 10 até 1, todos os números (pares e ímpares) são impressos decrescentemente.",
        trap: "A Ilusão da Paridade: Por começar em 10, o cérebro tende a achar que é só par, mas o decremento unitário pega todos."
      }
    ];

    /* =========================================================================
       ESTADO DO JOGADOR & RECURSOS TDAH (FEEDBACK HÁPTICO / MEMÓRIA LOCAL)
       ========================================================================= */
    let playerState = {
      level: 1,
      xp: 0,
      streak: 0,
      weaknesses: {} // Armazena ID da questão e vezes que errou
    };

    let currentIdx = 0;
    let selectedOption = null;
    let answered = false;

    // Inicialização LocalStorage
    function loadState() {
      const saved = localStorage.getItem('oraculo_save_state');
      if (saved) {
        playerState = JSON.parse(saved);
        updateHUD();
        renderWeaknesses();
      }
    }

    function saveState() {
      localStorage.setItem('oraculo_save_state', JSON.stringify(playerState));
      // Disparo em segundo plano para o Supabase (se configurado)
      syncToSupabase();
    }

    function triggerHaptic(type) {
      if ('vibrate' in navigator) {
        if (type === 'success') navigator.vibrate([40, 60, 40]);
        if (type === 'fail') navigator.vibrate([100, 50, 100]);
      }
    }

    function updateHUD() {
      document.getElementById('player-level').innerText = `LV. ${playerState.level}`;
      document.getElementById('player-xp').innerText = `${playerState.xp} XP`;
      document.getElementById('player-streak').innerText = `${playerState.streak}x`;
      
      const xpNeeded = playerState.level * 150;
      const progress = Math.min(100, (playerState.xp % xpNeeded) / xpNeeded * 100);
      document.getElementById('xp-fill').style.width = `${progress}%`;
    }

    function renderQuestion() {
      answered = false;
      const q = DATABASE[currentIdx];
      document.getElementById('quest-module').innerText = q.sector;
      document.getElementById('quest-title').innerText = q.question;
      
      const optContainer = document.getElementById('quest-options');
      optContainer.innerHTML = '';
      
      document.getElementById('analysis').style.display = 'none';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerHTML = `<strong>[${String.fromCharCode(65 + idx)}]</strong> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optContainer.appendChild(btn);
      });
    }

    function selectOption(idx) {
      if (answered) return;
      answered = true;
      selectedOption = idx;
      
      const q = DATABASE[currentIdx];
      const buttons = document.querySelectorAll('.btn-option');

      // Feedback visual das alternativas
      buttons.forEach((b, i) => {
        if (i === q.correct) b.classList.add('correct');
        if (i === idx && idx !== q.correct) b.classList.add('wrong');
        if (i === q.distractor) b.classList.add('almost');
      });

      // Avaliação de Sucesso / Erro
      if (idx === q.correct) {
        triggerHaptic('success');
        playerState.xp += 30 + (playerState.streak * 5);
        playerState.streak += 1;
        if (playerState.xp >= playerState.level * 150) {
          playerState.level += 1;
        }
      } else {
        triggerHaptic('fail');
        playerState.streak = 0;
        playerState.weaknesses[q.id] = (playerState.weaknesses[q.id] || 0) + 1;
      }

      saveState();
      updateHUD();
      renderWeaknesses();
      showAnalysis(idx === q.correct);
    }

    function showAnalysis(isCorrect) {
      const q = DATABASE[currentIdx];
      const box = document.getElementById('analysis');
      const title = document.getElementById('analysis-title');
      const text = document.getElementById('analysis-text');
      const trap = document.getElementById('analysis-trap');

      box.style.display = 'block';
      title.innerText = isCorrect ? "🎯 NEURO-CONEXÃO CONFIRMADA!" : "⚠️ FALHA REGISTRADA NO CÓDICE";
      title.style.color = isCorrect ? "var(--success)" : "var(--danger)";
      text.innerText = q.rationale;
      trap.innerText = `[ALERTA DE ARMADILHA]: ${q.trap}`;
    }

    function nextQuestion() {
      currentIdx = (currentIdx + 1) % DATABASE.length;
      renderQuestion();
    }

    function renderWeaknesses() {
      const cont = document.getElementById('weakness-container');
      cont.innerHTML = '';
      const keys = Object.keys(playerState.weaknesses);
      document.getElementById('weakness-count').innerText = `${keys.length} Tópicos Críticos`;

      keys.forEach(k => {
        const item = document.createElement('div');
        item.className = 'weakness-item';
        const q = DATABASE.find(x => x.id === k);
        item.innerHTML = `<span><strong>${k}:</strong> ${q ? q.sector : 'Tópico'}</span> <span>${playerState.weaknesses[k]}x erros</span>`;
        cont.appendChild(item);
      });
    }

    function toggleWeaknesses() {
      const c = document.getElementById('weakness-container');
      c.style.display = c.style.display === 'none' ? 'flex' : 'none';
    }

    /* =========================================================================
       CONEXÃO OPCIONAL // SUPABASE CLOUD SYNC
       ========================================================================= */
    const SUPABASE_URL = "https://aazdwdbmmvokborisuxd.supabase.co"; // Substituir pelas suas chaves
    const SUPABASE_KEY = "sb_publishable_TVwbt5bsVssBt7h4oSAe6Q_JzaJ1p4X";
    let sbClient = null;

    if (SUPABASE_URL !== "https://SEU-PROJETO.supabase.co") {
      sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    async function syncToSupabase() {
      if (!sbClient) return;
      try {
        await sbClient.from('oraculo_progress').upsert({
          user_id: 'amanda_anshiran',
          level: playerState.level,
          xp: playerState.xp,
          streak: playerState.streak,
          weaknesses: playerState.weaknesses,
          updated_at: new Date().toISOString()
        });
      } catch (err) {
        console.warn("Sync Supabase em espera:", err.message);
      }
    }

    // Inicialização
    loadState();
    renderQuestion();
  </script>
</body>
</html>
