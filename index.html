<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Viewport travada contra zoom acidental no iOS e respeitando safe-area -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Configurações Nativas de WebApp para iOS (Tela Cheia) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Oráculo RPG">
  
  <title>ORÁCULO RPG // BATTLE DUNGEON</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a10;
      --panel: #121622;
      --accent: #00f2fe;
      --player-hp: #00ff88;
      --boss-hp: #ff0055;
      --text: #e2e8f0;
      --pixel-font: 'Press Start 2P', monospace;
      --ui-font: 'Rajdhani', sans-serif;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none;
      -webkit-user-select: none; /* Desativa seleção azul de texto no iOS */
      -webkit-touch-callout: none; /* Desativa menu ao segurar o dedo no iOS */
      touch-action: manipulation; /* Desativa delay de clique duplo do iOS */
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui-font);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      /* Suporte ao Notch e Barra Home do iPhone */
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    /* ARENA DE BATALHA */
    .battle-scene {
      width: 100%;
      max-width: 600px;
      background: radial-gradient(circle at center, #1b233a 0%, #080a12 100%);
      border: 2px solid #2a3550;
      border-radius: 12px;
      padding: 14px;
      position: relative;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      margin-bottom: 10px;
      transition: transform 0.1s ease;
    }

    .shake {
      animation: shakeAnim 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* BARRAS DE STATUS */
    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .status-box { width: 48%; }
    .entity-name {
      font-family: var(--pixel-font);
      font-size: 0.6rem;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .bar-outer {
      width: 100%;
      height: 12px;
      background: #202738;
      border: 1px solid #3b4866;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.3s ease-out;
    }
    #player-hp-bar { background: var(--player-hp); width: 100%; }
    #boss-hp-bar { background: var(--boss-hp); width: 100%; }

    /* PALCO DOS PERSONAGENS */
    .stage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 14px;
      min-height: 110px;
    }
    .avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .sprite {
      font-size: 3rem;
      filter: drop-shadow(0 0 10px rgba(0,242,254,0.4));
      transition: transform 0.2s ease;
    }
    .boss-sprite {
      font-size: 3.5rem;
      filter: drop-shadow(0 0 12px rgba(255,0,85,0.5));
    }
    .hit-flash {
      filter: brightness(3) saturate(0) !important;
    }

    /* DIÁLOGO / DESAFIO */
    .boss-dialogue {
      background: rgba(18, 22, 34, 0.95);
      border: 1px solid #3b4866;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.88rem;
      line-height: 1.4;
      min-height: 60px;
      margin-bottom: 6px;
    }

    /* BOTÕES DE AÇÃO / GOLPES */
    .deck-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .combat-action {
      background: #161c2a;
      border: 1px solid #2e3a54;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 12px 14px;
      text-align: left;
      font-family: var(--ui-font);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-tap-highlight-color: transparent; /* Remove flash cinza ao tocar no iOS */
    }
    .combat-action:active {
      transform: scale(0.97);
      background: #242c3d;
      border-color: var(--accent);
    }
    .action-icon {
      font-family: var(--pixel-font);
      font-size: 0.55rem;
      background: #2a3550;
      padding: 4px 6px;
      border-radius: 4px;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* LOG DO COMBATE */
    .combat-log {
      width: 100%;
      max-width: 600px;
      margin-top: 10px;
      background: #06070a;
      border: 1px solid #1c2333;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 0.75rem;
      min-height: 55px;
      max-height: 80px;
      overflow-y: auto;
      color: #7dd3fc;
    }
  </style>
</head>
<body>

  <div class="battle-scene" id="arena">
    <div class="hud-bar">
      <div class="status-box">
        <div class="entity-name">
          <span>AMANDA (VOCÊ)</span>
          <span id="player-hp-txt">100/100</span>
        </div>
        <div class="bar-outer">
          <div class="bar-fill" id="player-hp-bar"></div>
        </div>
      </div>
      <div class="status-box">
        <div class="entity-name">
          <span id="boss-name">BOSS</span>
          <span id="boss-hp-txt">100/100</span>
        </div>
        <div class="bar-outer">
          <div class="bar-fill" id="boss-hp-bar"></div>
        </div>
      </div>
    </div>

    <div class="stage">
      <div class="avatar">
        <div class="sprite" id="player-sprite">🥋</div>
        <span style="font-size:0.7rem; font-weight:700; color:var(--player-hp);">HERÓI</span>
      </div>
      <div style="font-family:var(--pixel-font); font-size:1rem; color:#ff0055;">VS</div>
      <div class="avatar">
        <div class="sprite boss-sprite" id="boss-sprite">👹</div>
        <span style="font-size:0.7rem; font-weight:700; color:var(--boss-hp);">TITÃ</span>
      </div>
    </div>

    <div class="boss-dialogue" id="boss-speech">
      Conectando ao Códice...
    </div>
  </div>

  <div class="deck-container" id="actions-deck"></div>

  <div class="combat-log" id="combat-log">
    > Sessão iniciada. Toque em uma habilidade para contra-atacar!
  </div>

  <script>
    /* =========================================================================
       CREDENCIAS DO SUPABASE (CONFIGURADAS)
       ========================================================================= */
    const SUPABASE_URL = "https://aazdwdbmmvokborisuxd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TVwbt5bsVssBt7h4oSAe6Q_JzaJ1p4X";
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* =========================================================================
       SINTETIZADOR DE ÁUDIO RETRÔ EMBUTIDO (SUBSTITUI VIBRAÇÃO NO IPHONE)
       ========================================================================= */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSfx(type) {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'hit') {
        // Som de impacto crítico estridente
        osc.type = 'square';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'hurt') {
        // Som de dano sofrido / erro
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'win') {
        // Fanfarra de vitória curta
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(400, now + 0.1);
        osc.frequency.setValueAtTime(600, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    /* BASE DE BOSSES DAS PROVAS */
    const BOSSES = [
      {
        name: "DEVOIR CARTESIANO",
        sprite: "🧊",
        challenge: "René Descartes duvida das sensações para fundamentar a ciência. Qual ação epistêmica quebra a ilusão?",
        actions: [
          { text: "Ativar Dúvida Metódica: Rejeitar antigas opiniões frágeis até achar base sólida.", type: "crit", info: "Acerto crítico! O método cartesiano reconstrói o saber pelo Cogito." },
          { text: "Fundamentar tudo nos sentidos humanos com precisão.", type: "almost", info: "Quase acertou! Mas Descartes rejeita os sentidos por serem falíveis." },
          { text: "Concluir que a verdade científica é impossível de encontrar.", type: "fail", info: "Erro! Descartes busca e encontra uma verdade indubitável." }
        ]
      },
      {
        name: "TITÃ DO PODER CAPILAR",
        sprite: "👁️",
        challenge: "Michel Foucault afirma que o poder não é apenas repressivo. Como ele age na sociedade moderna?",
        actions: [
          { text: "Rede Produtiva: Disseminar saber, produzir discursos e prazeres.", type: "crit", info: "Impacto devastador! A microfísica do poder é positiva e geradora de saber." },
          { text: "Força de Restrição: Agir apenas proibindo e punindo o cidadão.", type: "almost", info: "Quase! Essa é a visão tradicional jurídica que Foucault justamente supera." },
          { text: "Instrumento exclusivo de criação de conceitos filosóficos.", type: "fail", info: "Erro! Criar conceitos é a definição de Deleuze para a filosofia." }
        ]
      },
      {
        name: "AUTÔMATO DE FICHEIROS C",
        sprite: "💾",
        challenge: "O log da fintech expande sem parar e precisa de leitura/escrita sem apagar dados. Qual modo do fopen() você conjura?",
        actions: [
          { text: "Conjurar Modo 'r+' (Atualização sem truncar o ficheiro).", type: "crit", info: "Dano Crítico! 'r+' permite leitura/escrita mantendo o conteúdo preservado." },
          { text: "Conjurar Modo 'w+' (Leitura e escrita de alto nível).", type: "almost", info: "Armadilha fatal! 'w+' apaga todo o ficheiro no segundo em que abre!" },
          { text: "Conjurar Modo 'a' para ler e escrever no final.", type: "fail", info: "Erro! 'a' isolado não permite leitura (exigiria 'a+')." }
        ]
      },
      {
        name: "SPECTRO RECURSIVO",
        sprite: "🌀",
        challenge: "A chamada recursiva está prestes a transbordar a memória! Qual mecanismo impede o Stack Overflow?",
        actions: [
          { text: "Condição-Base de Parada: Encerrar as auto-invocações no caso trivial.", type: "crit", info: "Estouro evitado! Sem caso-base a pilha cresce infinitamente até travar." },
          { text: "Substituição irrestrita de todos os laços de repetição por ponteiros.", type: "almost", info: "Quase! Recursão substitui loops, mas o que impede o estouro é a paragem." },
          { text: "Duplicação contínua da pilha de execução da CPU.", type: "fail", info: "Erro! Duplicar a pilha acelera o esgotamento da memória." }
        ]
      },
      {
        name: "GUARDIÃO DE VON NEUMANN",
        sprite: "⚡",
        challenge: "O processador exige seus três componentes essenciais de cálculo e controlo para operar. Quem você invoca?",
        actions: [
          { text: "Registradores + Unidade de Controle + ULA (Unidade Lógica e Aritmética).", type: "crit", info: "Núcleo ativado! Essa é a tríade fundamental de funcionamento da CPU." },
          { text: "Registradores + Barramentos + Memória Cache.", type: "almost", info: "Quase! Barramentos comunicam os módulos, mas não calculam." },
          { text: "Buffers de I/O + Memória Virtual + Placa Mãe.", type: "fail", info: "Incorreto! Componentes externos não integram o núcleo da CPU." }
        ]
      }
    ];

    let currentBossIdx = 0;
    let playerHP = 100;
    let bossHP = 100;

    function initBattle() {
      const b = BOSSES[currentBossIdx];
      bossHP = 100;
      updateBars();
      
      document.getElementById('boss-name').innerText = b.name;
      document.getElementById('boss-sprite').innerText = b.sprite;
      document.getElementById('boss-speech').innerText = b.challenge;
      
      const deck = document.getElementById('actions-deck');
      deck.innerHTML = '';

      const shuffledActions = [...b.actions].sort(() => Math.random() - 0.5);

      shuffledActions.forEach((act, idx) => {
        const btn = document.createElement('button');
        btn.className = 'combat-action';
        btn.innerHTML = `<span class="action-icon">GOLPE ${idx+1}</span> <span>${act.text}</span>`;
        btn.onclick = () => executeTurn(act);
        deck.appendChild(btn);
      });
    }

    function executeTurn(action) {
      const arena = document.getElementById('arena');
      const bossSprite = document.getElementById('boss-sprite');
      const playerSprite = document.getElementById('player-sprite');

      if (action.type === 'crit') {
        bossHP = Math.max(0, bossHP - 55);
        bossSprite.classList.add('hit-flash');
        playSfx('hit');
        logCombat(`💥 GOLPE CRÍTICO! ${action.info}`);
        setTimeout(() => bossSprite.classList.remove('hit-flash'), 250);
      } else if (action.type === 'almost') {
        bossHP = Math.max(0, bossHP - 15);
        playerHP = Math.max(0, playerHP - 20);
        arena.classList.add('shake');
        playSfx('hurt');
        logCombat(`⚠️ ARMADILHA DO DISTRATOR: ${action.info} Você sofreu 20 de dano!`);
        setTimeout(() => arena.classList.remove('shake'), 300);
      } else {
        playerHP = Math.max(0, playerHP - 35);
        arena.classList.add('shake');
        playerSprite.classList.add('hit-flash');
        playSfx('hurt');
        logCombat(`☠️ FALHA CRÍTICA! ${action.info} O Guardião contra-atacou (-35 HP)!`);
        setTimeout(() => {
          arena.classList.remove('shake');
          playerSprite.classList.remove('hit-flash');
        }, 300);
      }

      updateBars();

      if (bossHP <= 0) {
        playSfx('win');
        logCombat(`🏆 VITÓRIA! Você dominou o conceito de ${BOSSES[currentBossIdx].name}!`);
        saveProgressToSupabase(BOSSES[currentBossIdx].name, "VITÓRIA");
        setTimeout(() => {
          currentBossIdx = (currentBossIdx + 1) % BOSSES.length;
          playerHP = Math.min(100, playerHP + 40);
          initBattle();
        }, 1200);
      } else if (playerHP <= 0) {
        logCombat(`💀 HP ESGOTADO! Reorganizando estratégia...`);
        playerHP = 100;
        setTimeout(initBattle, 1500);
      }
    }

    function updateBars() {
      document.getElementById('player-hp-bar').style.width = playerHP + '%';
      document.getElementById('boss-hp-bar').style.width = bossHP + '%';
      document.getElementById('player-hp-txt').innerText = `${playerHP}/100`;
      document.getElementById('boss-hp-txt').innerText = `${bossHP}/100`;
    }

    function logCombat(msg) {
      const log = document.getElementById('combat-log');
      log.innerHTML = `> ${msg}<br>` + log.innerHTML;
    }

    async function saveProgressToSupabase(bossName, status) {
      try {
        await sbClient.from('oraculo_progress').upsert({
          user_id: 'amanda_anshiran',
          level: currentBossIdx + 1,
          xp: (currentBossIdx + 1) * 100,
          streak: 1,
          weaknesses: { last_boss: bossName, result: status },
          updated_at: new Date().toISOString()
        });
      } catch (e) {
        console.log("Supabase save:", e);
      }
    }

    initBattle();
  </script>
</body>
</html>
