<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ORÁCULO // PROTOCOLO MATRIX</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070a;
      --lane-border: #142036;
      --cyan: #00f2fe;
      --pink: #ff0055;
      --yellow: #facc15;
      --green: #00ff88;
      --text: #e2e8f0;
      --font-retro: 'Press Start 2P', monospace;
      --font-ui: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    /* HUD SUPERIOR */
    .hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d121f;
      border: 2px solid #1c2740;
      border-radius: 8px;
      padding: 8px 12px;
      font-family: var(--font-retro);
      font-size: 0.65rem;
      margin-bottom: 6px;
    }
    .hud-val { color: var(--cyan); }
    .combo-glow { color: var(--yellow); text-shadow: 0 0 8px rgba(250, 204, 21, 0.6); }

    /* ARENA DE LANES EM TEMPO REAL */
    .matrix-arena {
      width: 100%;
      max-width: 480px;
      height: 380px;
      background: radial-gradient(ellipse at bottom, #0f172a 0%, #030508 100%);
      border: 2px solid #202d4a;
      border-radius: 10px;
      position: relative;
      display: flex;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .lane {
      flex: 1;
      height: 100%;
      border-right: 1px dashed var(--lane-border);
      position: relative;
      cursor: pointer;
      display: flex;
      justify-content: center;
    }
    .lane:last-child { border-right: none; }
    .lane.active-lane {
      background: rgba(0, 242, 254, 0.04);
    }

    /* LINHA DE DEFESA (BASE) */
    .defense-line {
      position: absolute;
      bottom: 45px;
      left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow: 0 0 10px var(--cyan);
    }

    .player-node {
      position: absolute;
      bottom: 8px;
      font-size: 1.8rem;
      filter: drop-shadow(0 0 8px var(--cyan));
      transition: left 0.15s ease-out;
    }

    /* INIMIGOS QUE DESCEM */
    .enemy {
      position: absolute;
      width: 90%;
      background: #141b2b;
      border: 1px solid var(--pink);
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
      transform: translateY(0);
      pointer-events: none;
    }
    .enemy-type {
      font-family: var(--font-retro);
      font-size: 0.5rem;
      color: var(--pink);
      margin-bottom: 2px;
      display: block;
    }

    /* CHIPS DE BATALHA (MÃO DO JOGADOR) */
    .deck-container {
      width: 100%;
      max-width: 480px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .deck-title {
      font-family: var(--font-retro);
      font-size: 0.55rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
    .chips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .chip-btn {
      background: #101624;
      border: 1px solid #273552;
      border-radius: 8px;
      padding: 10px 4px;
      color: #e2e8f0;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .chip-btn.selected {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
      background: #182238;
      transform: scale(1.02);
    }
    .chip-tag {
      font-family: var(--font-retro);
      font-size: 0.5rem;
      color: var(--cyan);
    }

    /* OVERCLOCK (FRENESI DE FOCO) */
    .overclock-active {
      border-color: var(--yellow) !important;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.5) !important;
    }

    /* FLASH DE DANO */
    .screen-shake {
      animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-4px, 0, 0); }
      30%, 70% { transform: translate3d(5px, 0, 0); }
    }
  </style>
</head>
<body>

  <!-- STATUS EM TEMPO REAL -->
  <div class="hud">
    <div>VIDA: <span id="txt-hp" class="hud-val" style="color:var(--green)">100%</span></div>
    <div>PONTOS: <span id="txt-score" class="hud-val">0</span></div>
    <div id="box-combo" class="combo-glow">0x COMBO</div>
  </div>

  <!-- ARENA MATRIX DE 3 FAIXAS -->
  <div class="matrix-arena" id="arena">
    <div class="defense-line"></div>
    <div class="lane" id="lane-0" onclick="fireAtLane(0)"></div>
    <div class="lane" id="lane-1" onclick="fireAtLane(1)"></div>
    <div class="lane" id="lane-2" onclick="fireAtLane(2)"></div>
    <div class="player-node" id="player">🥋</div>
  </div>

  <!-- DECK DE CHIPS TÉCNICOS -->
  <div class="deck-container">
    <div class="deck-title">
      <span>CHIPS DISPONÍVEIS (SELECIONE E TOQUE NA FAIXA):</span>
      <span id="txt-status" style="color:var(--cyan)">SISTEMA PRONTO</span>
    </div>
    <div class="chips-grid" id="chips-area"></div>
  </div>

  <script>
    /* =========================================================================
       CREDENCIAS SUPABASE INTEGRADAS
       ========================================================================= */
    const SUPABASE_URL = "https://aazdwdbmmvokborisuxd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TVwbt5bsVssBt7h4oSAe6Q_JzaJ1p4X";
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* ÁUDIO NATIVO RETRÔ (SEM LATÊNCIA NO IOS) */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function beep(fStart, fEnd, type = 'square', dur = 0.12) {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);
      const now = actx.currentTime;
      osc.type = type;
      osc.frequency.setValueAtTime(fStart, now);
      osc.frequency.exponentialRampToValueAtTime(fEnd, now + dur);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + dur);
      osc.start(now);
      osc.stop(now + dur);
    }

    /* BANCO DE ENIGMAS / INIMIGOS E RESPOSTAS */
    const ENEMY_DATABASE = [
      {
        tag: "ARQUIVO C",
        label: "Auditoria contínua: Ler/Gravar sem apagar",
        targetChip: "r+",
        trapChip: "w+"
      },
      {
        tag: "EPISTEME",
        label: "Dúvida radical dos sentidos para refundar o saber",
        targetChip: "Descartes",
        trapChip: "Platão"
      },
      {
        tag: "CPU CORE",
        label: "Registradores + Unidade Controle + ...?",
        targetChip: "ULA",
        trapChip: "Barramentos"
      },
      {
        tag: "PODER",
        label: "Microfísica: Rede capilar produtiva de saber",
        targetChip: "Foucault",
        trapChip: "Nietzsche"
      },
      {
        tag: "MEMÓRIA",
        label: "Mecanismo obrigatório para travar Stack Overflow",
        targetChip: "Caso-Base",
        trapChip: "Ponteiro"
      },
      {
        tag: "ESTRUTURAS",
        label: "Entrada num extremo e saída estrita no outro",
        targetChip: "Fila (FIFO)",
        trapChip: "Pilha (LIFO)"
      }
    ];

    const ALL_CHIPS = ["r+", "w+", "Descartes", "Platão", "ULA", "Barramentos", "Foucault", "Nietzsche", "Caso-Base", "Fila (FIFO)"];

    let playerHP = 100;
    let score = 0;
    let streak = 0;
    let activeEnemies = [];
    let selectedChip = null;
    let gameLoop = null;
    let spawnTimer = null;

    // Posiciona o jogador na faixa
    function updatePlayerPos(laneIdx) {
      const p = document.getElementById('player');
      const positions = ['12%', '45%', '78%'];
      p.style.left = positions[laneIdx];
    }

    function renderDeck() {
      const area = document.getElementById('chips-area');
      area.innerHTML = '';
      
      // Garante uma rotação dinâmica de 6 chips
      const currentTargetChips = activeEnemies.map(e => e.data.targetChip);
      const randomFillers = ALL_CHIPS.filter(c => !currentTargetChips.includes(c)).sort(() => Math.random() - 0.5);
      const hand = [...new Set([...currentTargetChips, ...randomFillers])].slice(0, 6).sort(() => Math.random() - 0.5);

      hand.forEach((chipName, idx) => {
        const btn = document.createElement('button');
        btn.className = 'chip-btn';
        if (selectedChip === chipName) btn.classList.add('selected');
        btn.innerHTML = `<span class="chip-tag">CHIP 0${idx+1}</span><span>${chipName}</span>`;
        btn.onclick = (e) => {
          e.stopPropagation();
          selectChip(chipName);
        };
        area.appendChild(btn);
      });
    }

    function selectChip(name) {
      selectedChip = name;
      beep(600, 800, 'sine', 0.08);
      document.querySelectorAll('.chip-btn').forEach(b => {
        b.classList.toggle('selected', b.innerText.includes(name));
      });
      document.getElementById('txt-status').innerText = `ARMADO: [${name}]`;
    }

    function spawnEnemy() {
      if (activeEnemies.length >= 3) return;

      const randomData = ENEMY_DATABASE[Math.floor(Math.random() * ENEMY_DATABASE.length)];
      const lane = Math.floor(Math.random() * 3);

      // Evita dois inimigos sobrepostos na mesma lane
      if (activeEnemies.some(e => e.lane === lane && e.y < 90)) return;

      const laneElem = document.getElementById(`lane-${lane}`);
      const el = document.createElement('div');
      el.className = 'enemy';
      el.innerHTML = `<span class="enemy-type">${randomData.tag}</span>${randomData.label}`;
      laneElem.appendChild(el);

      activeEnemies.push({
        lane: lane,
        y: 0,
        speed: 1.1 + (streak * 0.1), // Fica mais rápido com combos
        element: el,
        data: randomData
      });

      renderDeck();
    }

    function fireAtLane(laneIdx) {
      updatePlayerPos(laneIdx);

      if (!selectedChip) {
        document.getElementById('txt-status').innerText = "⚠️ SELECIONE UM CHIP PRIMEIRO!";
        beep(120, 80, 'sawtooth', 0.1);
        return;
      }

      // Procura o inimigo mais próximo na faixa selecionada
      const targetEnemy = activeEnemies
        .filter(e => e.lane === laneIdx)
        .sort((a, b) => b.y - a.y)[0];

      if (targetEnemy) {
        if (selectedChip === targetEnemy.data.targetChip) {
          // ACERTO CRÍTICO!
          beep(400, 950, 'square', 0.15);
          score += 50 + (streak * 10);
          streak++;
          destroyEnemy(targetEnemy, true);
        } else {
          // DISTRATOR / ERRO
          beep(180, 60, 'sawtooth', 0.25);
          streak = 0;
          playerHP = Math.max(0, playerHP - 15);
          triggerShake();
        }
      } else {
        // Disparo no vácuo
        beep(250, 150, 'triangle', 0.08);
      }

      updateHUD();
      selectedChip = null;
      renderDeck();
    }

    function destroyEnemy(enemy, isKill) {
      enemy.element.remove();
      activeEnemies = activeEnemies.filter(e => e !== enemy);
    }

    function triggerShake() {
      const arena = document.getElementById('arena');
      arena.classList.add('screen-shake');
      setTimeout(() => arena.classList.remove('screen-shake'), 220);
    }

    function updateHUD() {
      document.getElementById('txt-hp').innerText = `${playerHP}%`;
      document.getElementById('txt-score').innerText = score;
      const cBox = document.getElementById('box-combo');
      cBox.innerText = `${streak}x COMBO`;

      if (streak >= 4) {
        document.getElementById('arena').classList.add('overclock-active');
        cBox.innerText = `🔥 OVERCLOCK ${streak}x`;
      } else {
        document.getElementById('arena').classList.remove('overclock-active');
      }

      if (playerHP <= 25) {
        document.getElementById('txt-hp').style.color = 'var(--pink)';
      }
    }

    function runGameLoop() {
      activeEnemies.forEach(enemy => {
        enemy.y += enemy.speed;
        enemy.element.style.top = `${enemy.y}px`;

        // Se o inimigo cruzar a linha de defesa (310px)
        if (enemy.y >= 310) {
          playerHP = Math.max(0, playerHP - 20);
          streak = 0;
          beep(120, 40, 'sawtooth', 0.3);
          triggerShake();
          destroyEnemy(enemy, false);
          updateHUD();

          if (playerHP <= 0) {
            gameOver();
          }
        }
      });
    }

    function gameOver() {
      clearInterval(gameLoop);
      clearInterval(spawnTimer);
      alert(`☠️ BRECHA NO SISTEMA! Pontuação Final: ${score}`);
      saveProgress(score);
      // Reinicia arena
      location.reload();
    }

    async function saveProgress(finalScore) {
      try {
        await sbClient.from('oraculo_progress').upsert({
          user_id: 'amanda_anshiran',
          level: Math.floor(finalScore / 200) + 1,
          xp: finalScore,
          streak: streak,
          weaknesses: { modo: "arcade_realtime", score: finalScore },
          updated_at: new Date().toISOString()
        });
      } catch (err) {
        console.warn("Sync:", err);
      }
    }

    // Inicialização do Jogo
    updatePlayerPos(1);
    renderDeck();
    gameLoop = setInterval(runGameLoop, 30);
    spawnTimer = setInterval(spawnEnemy, 2400);
  </script>
</body>
</html>
