<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Siliconia MMO: O Despertar do Kernel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-pixel: 'Press Start 2P', monospace;
      --font-mono: 'Share Tech Mono', monospace;
      --font-sans: 'Inter', sans-serif;

      --bg-dark: #06070d;
      --panel-bg: rgba(13, 17, 34, 0.92);
      --panel-border: #4338ca;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --hp: #ef4444;
      --mp: #06b6d4;
      --exp: #10b981;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-dark);
      color: #f8fafc;
      font-family: var(--font-sans);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
    }

    /* VIEWPORT DO MUNDO RPG (TELA CHEIA) */
    #canvas-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }
    canvas#gameCanvas {
      width: 100%; height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* INTERFACE HUD SUPERIOR */
    .top-hud {
      position: absolute;
      top: 10px; left: 10px; right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      pointer-events: none;
    }

    .player-plate {
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 220px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      pointer-events: auto;
    }

    .plate-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-pixel);
      font-size: 8px;
      color: var(--gold);
    }

    .bar-shell {
      height: 8px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill-hp { height: 100%; background: var(--hp); width: 100%; transition: width 0.2s; }
    .bar-fill-mp { height: 100%; background: var(--mp); width: 100%; transition: width 0.2s; }
    .bar-fill-xp { height: 100%; background: var(--exp); width: 0%; transition: width 0.2s; }

    .target-plate {
      display: none;
      background: var(--panel-bg);
      border: 2px solid #ef4444;
      border-radius: 8px;
      padding: 8px 12px;
      width: 180px;
      flex-direction: column;
      gap: 4px;
      pointer-events: auto;
    }

    /* CHAT MMORPG LATERAL / INFERIOR */
    .mmo-chat {
      position: absolute;
      bottom: 95px; left: 10px;
      width: 280px; height: 85px;
      background: rgba(10, 13, 26, 0.75);
      border: 1.5px solid rgba(99, 102, 241, 0.3);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
      z-index: 10;
    }
    .chat-row { line-height: 1.2; text-shadow: 1px 1px 0 #000; }
    .chat-author { color: var(--accent); font-weight: 700; }
    .chat-loot { color: var(--gold); }
    .chat-server { color: #38bdf8; }

    /* HOTBAR DE HABILIDADES & AÇÕES (MMO STYLE) */
    .bottom-bar {
      position: absolute;
      bottom: 12px; left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 20;
      pointer-events: auto;
      padding: 0 10px;
    }

    .skill-slot {
      width: 54px; height: 54px;
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      transition: all 0.1s;
    }
    .skill-slot:active { transform: scale(0.92); border-color: var(--accent); }
    .skill-key {
      position: absolute;
      top: 2px; left: 4px;
      font-family: var(--font-pixel);
      font-size: 7px;
      color: rgba(255,255,255,0.6);
    }
    .skill-icon { font-size: 18px; margin-top: 4px; }
    .skill-name { font-size: 8px; font-weight: 700; text-transform: uppercase; color: #cbd5e1; }

    /* MODAL DE QUEST / DIÁLOGO COM NPC */
    .quest-dialogue {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 90%; max-width: 440px;
      background: var(--panel-bg);
      border: 3px solid var(--gold);
      border-radius: 12px;
      padding: 16px;
      z-index: 50;
      box-shadow: 0 0 35px rgba(0,0,0,0.95);
    }
    .quest-dialogue.open { display: flex; flex-direction: column; gap: 12px; }

    .npc-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
    }
    .npc-portrait {
      width: 40px; height: 40px;
      border: 2px solid var(--gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: #000;
    }

    .quest-content { font-size: 13px; line-height: 1.5; color: #e2e8f0; }
    .quest-options { display: flex; flex-direction: column; gap: 8px; }

    .btn-quest-choice {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: #fff;
      padding: 10px 12px;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      line-height: 1.4;
    }
    .btn-quest-choice:active { border-color: var(--accent); background: var(--accent-glow); }

    .btn-dialogue-close {
      align-self: flex-end;
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 11px;
      cursor: pointer;
    }

    /* CONTROLE ANALÓGICO MOBILE (JOYSTICK VIRTUAL DINÂMICO) */
    .touch-zone-left {
      position: absolute;
      bottom: 85px; left: 15px;
      width: 110px; height: 110px;
      border: 2px dashed rgba(255,255,255,0.15);
      border-radius: 50%;
      z-index: 15;
      display: none;
    }
    @media (max-width: 768px) {
      .touch-zone-left { display: block; }
      .mmo-chat { width: 180px; bottom: 85px; }
    }
  </style>
</head>
<body>

  <!-- VIEWPORT DO JOGO -->
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- HUD SUPERIOR -->
  <div class="top-hud">
    <!-- Player Plate -->
    <div class="player-plate">
      <div class="plate-header">
        <span>AMANDA</span>
        <span id="player-lvl">LVL 1</span>
      </div>
      <div class="bar-shell"><div class="bar-fill-hp" id="hp-bar"></div></div>
      <div class="bar-shell"><div class="bar-fill-mp" id="mp-bar"></div></div>
      <div class="bar-shell"><div class="bar-fill-xp" id="xp-bar"></div></div>
    </div>

    <!-- Target Plate (Monstro Travado) -->
    <div class="target-plate" id="target-plate">
      <div style="font-family:var(--font-pixel); font-size:8px; color:#ef4444;" id="target-name">BUG_DE_HEAP</div>
      <div class="bar-shell"><div class="bar-fill-hp" id="target-hp-bar" style="background:#ef4444;"></div></div>
    </div>
  </div>

  <!-- CHAT MMORPG -->
  <div class="mmo-chat" id="mmo-chat">
    <div class="chat-row"><span class="chat-server">[KERNEL]:</span> Servidor conectado. Bem-vinda a Siliconia!</div>
  </div>

  <!-- ANALÓGICO TOUCH (MOBILE) -->
  <div class="touch-zone-left" id="touchJoystick"></div>

  <!-- HOTBAR DE SKILLS (ATALHOS 1, 2, 3, 4) -->
  <div class="bottom-bar">
    <div class="skill-slot" onclick="castSkill(1)">
      <span class="skill-key">1</span>
      <span class="skill-icon">🧹</span>
      <span class="skill-name">Free()</span>
    </div>
    <div class="skill-slot" onclick="castSkill(2)">
      <span class="skill-key">2</span>
      <span class="skill-icon">⚡</span>
      <span class="skill-name">TLB Hit</span>
    </div>
    <div class="skill-slot" onclick="castSkill(3)">
      <span class="skill-key">3</span>
      <span class="skill-icon">🛡️</span>
      <span class="skill-name">DMA Shield</span>
    </div>
    <div class="skill-slot" onclick="castSkill(4)">
      <span class="skill-key">4</span>
      <span class="skill-icon">📖</span>
      <span class="skill-name">Episteme</span>
    </div>
  </div>

  <!-- MODAL DE DIÁLOGO COM NPCS -->
  <div class="quest-dialogue" id="questDialogue">
    <div class="npc-banner">
      <div class="npc-portrait" id="npcIcon">🧙</div>
      <div>
        <div style="font-family:var(--font-pixel); font-size:10px; color:var(--gold);" id="npcTitle">MESTRE RITCHIE</div>
        <div style="font-size:11px; color:var(--text-muted);" id="npcRole">Técnicas de Programação</div>
      </div>
    </div>
    <div class="quest-content" id="npcDialogueText">Lore e desafio...</div>
    <div class="quest-options" id="npcChoices"></div>
    <button class="btn-dialogue-close" onclick="closeDialogue()">Fechar Janela</button>
  </div>

  <script>
    /* =========================================================
       1. GAME ENGINE & MUNDO MMORPG ISOMÉTRICO/TOP-DOWN
       ========================================================= */
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Estado do Jogador (Amanda)
    const player = {
      x: 600, y: 600,
      targetX: 600, targetY: 600,
      speed: 3.5,
      hp: 100, maxHp: 100,
      mp: 80, maxMp: 80,
      xp: 0, maxXp: 300,
      level: 1,
      target: null
    };

    // Mapa Expandido do Mundo (1800 x 1800 pixels)
    const WORLD_SIZE = 1800;

    // Outros "Jogadores" no Servidor (Simulação MMORPG Co-op)
    const otherPlayers = [
      { name: "Linus_P", x: 650, y: 550, targetX: 650, targetY: 550, hp: 100, class: "Kernel Knight", icon: "⚔️" },
      { name: "Ada_Dev", x: 700, y: 680, targetX: 700, targetY: 680, hp: 90, class: "Pointer Mage", icon: "🧙" },
      { name: "Turing_99", x: 520, y: 620, targetX: 520, targetY: 620, hp: 100, class: "Logic Rogue", icon: "🏹" }
    ];

    // NPCs Acadêmicos
    const npcs = [
      {
        id: "ritchie",
        name: "Mestre Dennis Ritchie",
        role: "Técnicas de Programação (Linguagem C)",
        x: 450, y: 450,
        icon: "📜",
        dialogue: "Saudações, Amanda! A memória física do nosso reino foi corrompida por escaninhos órfãos sem desalocação[cite: 184, 185]. Precisamos forjar ponteiros seguros!",
        challenge: {
          q: "Você recebe o endereço '0x104' de uma variável inteira 'int valor = 42;'[cite: 184]. Como sua função deve operar para dobrar esse valor no local físico sem criar cópias na pilha[cite: 184, 188]?",
          opts: [
            { t: "Receber 'int *p' e aplicar '*p = 84;' desreferenciando o ponteiro[cite: 184, 188].", ok: true, exp: "Exato! '&' obtém o endereço e '*' manipula o conteúdo no escaninho de memória sem gastar pilha[cite: 184, 188]!" },
            { t: "Passar 'valor' por cópia direta com 'valor = 84;'[cite: 180, 184].", ok: false, exp: "Isso alteraria apenas a cópia local da função, deixando o escaninho original inalterado[cite: 180, 184]." },
            { t: "Alocar com 'malloc(100)' e nunca chamar 'free()'[cite: 185, 197].", ok: false, exp: "Isso cria um terrível Vazamento de Memória (Memory Leak) que derruba o sistema por exaustão de RAM[cite: 185]!" }
          ]
        }
      },
      {
        id: "tanenbaum",
        name: "Guardião Tanenbaum",
        role: "Sistemas Operacionais (Memória Virtual)",
        x: 850, y: 450,
        icon: "🏛️",
        dialogue: "Os processos estão em disputa violenta por quadros de página na memória física[cite: 39, 44]! A Unidade de Gerenciamento de Memória (MMU) precisa de diretrizes[cite: 40].",
        challenge: {
          q: "A CPU gera uma referência ao endereço lógico (Página 2, deslocamento 50)[cite: 45, 51]. Como garantir a menor latência possível sem acionar o disco rígido[cite: 49, 50]?",
          opts: [
            { t: "Consultar a cache TLB (Translation Lookaside Buffer); ocorrendo TLB Hit, obtém o bloco físico imediatamente[cite: 49, 50].", ok: true, exp: "Perfeito! O TLB Hit evita ler a tabela no disco ou RAM, alavancando a localidade temporal[cite: 46, 50]!" },
            { t: "Acessar a memória secundária em disco a cada instrução executada[cite: 30, 48].", ok: false, exp: "O disco é até 6 ordens de magnitude mais lento que a memória principal[cite: 30]!" },
            { t: "Forçar paginação monousuária desativando a multiprogramação[cite: 33, 35].", ok: false, exp: "Isso destruiria a capacidade do computador de executar processos em paralelo[cite: 35, 103]." }
          ]
        }
      },
      {
        id: "socrates",
        name: "Oráculo Socrático",
        role: "Construção do Pensamento Filosófico",
        x: 650, y: 850,
        icon: "🦉",
        dialogue: "De nada vale dominar circuitos e pontes de barramento se sua mente for refém de preconceitos e falácias lógicas, Amanda.",
        challenge: {
          q: "Em um debate sobre inteligência e sistemas computacionais, como sustentar uma tese sem incorrer em sofismas?",
          opts: [
            { t: "Diferenciando doxa (mera opinião subjetiva) de episteme (conhecimento fundamentado por método e evidências).", ok: true, exp: "Brilhante! O rigor dialético e acadêmico exige bases sólidas e refutação demonstrável." },
            { t: "Impondo uma conclusão pelo prestígio do orador (falácia de autoridade).", ok: false, exp: "Argumentos de autoridade são falácias que violam o livre exame racional." }
          ]
        }
      }
    ];

    // Inimigos do Mapa (Bugs / Monstros Conceituais)
    let monsters = [
      { id: 1, name: "Vazamento de Heap", hp: 80, maxHp: 80, x: 420, y: 650, icon: "👾", type: "heap" },
      { id: 2, name: "TLB Miss Daemon", hp: 100, maxHp: 100, x: 800, y: 680, icon: "💀", type: "tlb" },
      { id: 3, name: "Fragmentação Externa", hp: 90, maxHp: 90, x: 550, y: 400, icon: "🕸️", type: "frag" },
      { id: 4, name: "Giga-Bug do Kernel", hp: 200, maxHp: 200, x: 750, y: 780, icon: "👹", type: "boss" }
    ];

    // Projéteis / Efeitos de Magia
    let spellEffects = [];

    /* =========================================================
       2. CONTROLE DE TOQUE, MOUSE E MOVIMENTO
       ========================================================= */
    let touchStartPos = null;

    canvas.addEventListener("pointerdown", e => {
      // Coordenadas mundiais baseadas na câmera
      const worldClickX = e.clientX - canvas.width / 2 + player.x;
      const worldClickY = e.clientY - canvas.height / 2 + player.y;

      // 1. Checa clique em NPC
      for (let n of npcs) {
        if (Math.hypot(worldClickX - n.x, worldClickY - n.y) < 35) {
          openNpcDialogue(n);
          return;
        }
      }

      // 2. Checa clique em Monstro (Target Lock)
      for (let m of monsters) {
        if (Math.hypot(worldClickX - m.x, worldClickY - m.y) < 35) {
          lockTarget(m);
          return;
        }
      }

      // 3. Move o jogador até o ponto tocado no chão
      player.targetX = Math.max(40, Math.min(WORLD_SIZE - 40, worldClickX));
      player.targetY = Math.max(40, Math.min(WORLD_SIZE - 40, worldClickY));
    });

    function lockTarget(m) {
      player.target = m;
      document.getElementById("target-plate").style.display = "flex";
      document.getElementById("target-name").innerText = m.name.toUpperCase();
      updateTargetHp();
      logChat("SISTEMA", `Alvo travado: ${m.name}`);
    }

    function updateTargetHp() {
      if (!player.target) return;
      const pct = Math.max(0, (player.target.hp / player.target.maxHp) * 100);
      document.getElementById("target-hp-bar").style.width = `${pct}%`;
    }

    /* =========================================================
       3. SISTEMA DE COMBATE & SKILLS ATIVAS
       ========================================================= */
    function castSkill(num) {
      if (player.mp < 15) {
        logChat("SISTEMA", "Mana insuficiente!");
        return;
      }

      if (!player.target) {
        logChat("SISTEMA", "Selecione um monstro no mapa primeiro!");
        return;
      }

      player.mp -= 15;
      updateHud();

      const m = player.target;
      let damage = 25;
      let spellName = "FREE()";

      if (num === 1) { // Free()
        damage = m.type === "heap" ? 50 : 30; // Crítico em vazamentos de heap!
        spellName = "FREE() [Desalocação]";
      } else if (num === 2) { // TLB Burst
        damage = m.type === "tlb" ? 60 : 25;
        spellName = "TLB_BURST [Localidade Temporal]";
      } else if (num === 3) { // DMA Shield
        player.hp = Math.min(player.maxHp, player.hp + 30);
        damage = 15;
        spellName = "DMA_SHIELD [Canal Direto]";
      } else if (num === 4) { // Episteme
        damage = 35;
        spellName = "EPISTEME [Refutação Dialética]";
      }

      // Animação de projétil
      spellEffects.push({
        fromX: player.x, fromY: player.y,
        toX: m.x, toY: m.y,
        progress: 0,
        text: `-${damage}`
      });

      m.hp -= damage;
      updateTargetHp();
      logChat("AMANDA", `Lançou ${spellName} causando ${damage} de dano!`);

      if (m.hp <= 0) {
        logChat("LOOT", `Monstro derrotado! +120 XP e 1x Fragmento de Inode!`);
        player.xp += 120;
        if (player.xp >= player.maxXp) {
          player.level++;
          player.xp = 0;
          player.maxHp += 20; player.hp = player.maxHp;
          player.maxMp += 20; player.mp = player.maxMp;
          logChat("SERVER", `LEVEL UP! Amanda alcançou o Nível ${player.level}!`);
        }
        updateHud();
        monsters = monsters.filter(item => item.id !== m.id);
        player.target = null;
        document.getElementById("target-plate").style.display = "none";
      }
    }

    /* =========================================================
       4. LOOP PRINCIPAL & RENDERIZAÇÃO COM CÂMERA DINÂMICA
       ========================================================= */
    function update() {
      // Movimento do Jogador
      const dist = Math.hypot(player.targetX - player.x, player.targetY - player.y);
      if (dist > 5) {
        player.x += ((player.targetX - player.x) / dist) * player.speed;
        player.y += ((player.targetY - player.y) / dist) * player.speed;
      }

      // Movimento autônomo dos outros players online
      otherPlayers.forEach(p => {
        if (Math.random() < 0.02) {
          p.targetX = Math.max(100, Math.min(WORLD_SIZE - 100, p.x + (Math.random() * 80 - 40)));
          p.targetY = Math.max(100, Math.min(WORLD_SIZE - 100, p.y + (Math.random() * 80 - 40)));
        }
        const d = Math.hypot(p.targetX - p.x, p.targetY - p.y);
        if (d > 4) {
          p.x += ((p.targetX - p.x) / d) * 2;
          p.y += ((p.targetY - p.y) / d) * 2;
        }
      });

      // Regeneração passiva de MP
      if (player.mp < player.maxMp) {
        player.mp += 0.05;
        updateHud();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Câmera Centralizada em Amanda
      const camX = canvas.width / 2 - player.x;
      const camY = canvas.height / 2 - player.y;

      ctx.save();
      ctx.translate(camX, camY);

      // 1. Grade do Terreno do Kernel (Chão de Circuito)
      ctx.fillStyle = "#070914";
      ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

      ctx.strokeStyle = "rgba(99, 102, 241, 0.12)";
      ctx.lineWidth = 1;
      for (let x = 0; x < WORLD_SIZE; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
      }
      for (let y = 0; y < WORLD_SIZE; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
      }

      // Barramentos Centrais
      ctx.fillStyle = "#1e1b4b";
      ctx.fillRect(0, 580, WORLD_SIZE, 40);
      ctx.fillRect(580, 0, 40, WORLD_SIZE);

      // 2. Desenha NPCs
      npcs.forEach(n => {
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.arc(n.x, n.y, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = "20px serif";
        ctx.fillText(n.icon, n.x - 10, n.y + 7);

        // Ícone de Missão flutuante '!'
        ctx.fillStyle = "#fbbf24";
        ctx.font = "10px 'Press Start 2P'";
        ctx.fillText("!", n.x - 4, n.y - 24);

        ctx.fillStyle = "#f8fafc";
        ctx.font = "10px 'Inter'";
        ctx.fillText(n.name, n.x - 30, n.y + 30);
      });

      // 3. Desenha Monstros
      monsters.forEach(m => {
        ctx.font = "24px serif";
        ctx.fillText(m.icon, m.x - 12, m.y + 8);

        // Barrinha de Vida do Monstro
        ctx.fillStyle = "#000";
        ctx.fillRect(m.x - 18, m.y - 22, 36, 5);
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(m.x - 18, m.y - 22, (m.hp / m.maxHp) * 36, 5);

        ctx.fillStyle = "#ef4444";
        ctx.font = "9px 'Inter'";
        ctx.fillText(m.name, m.x - 24, m.y + 24);
      });

      // 4. Desenha Outros Jogadores Online
      otherPlayers.forEach(p => {
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(p.x - 8, p.y - 8, 16, 16);
        ctx.font = "12px serif";
        ctx.fillText(p.icon, p.x - 6, p.y - 10);

        ctx.fillStyle = "#94a3b8";
        ctx.font = "9px 'Inter'";
        ctx.fillText(p.name, p.x - 18, p.y + 20);
      });

      // 5. Desenha Amanda (Avatar em Pixel Art)
      ctx.fillStyle = "#c084fc"; // Borahae Purple
      ctx.fillRect(player.x - 10, player.y - 10, 20, 20);
      ctx.fillStyle = "#fff";
      ctx.fillRect(player.x - 5, player.y - 6, 3, 3);
      ctx.fillRect(player.x + 2, player.y - 6, 3, 3);

      ctx.fillStyle = "#fbbf24";
      ctx.font = "8px 'Press Start 2P'";
      ctx.fillText("AMANDA", player.x - 22, player.y - 16);

      // Círculo de seleção no monstro travado
      if (player.target) {
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.target.x, player.target.y, 22, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Efeitos de Magia
      spellEffects.forEach((sp, i) => {
        sp.progress += 0.08;
        const curX = sp.fromX + (sp.toX - sp.fromX) * sp.progress;
        const curY = sp.fromY + (sp.toY - sp.fromY) * sp.progress;

        ctx.fillStyle = "#06b6d4";
        ctx.beginPath(); ctx.arc(curX, curY, 6, 0, Math.PI*2); ctx.fill();

        if (sp.progress >= 1) {
          ctx.fillStyle = "#f59e0b";
          ctx.font = "11px 'Press Start 2P'";
          ctx.fillText(sp.text, sp.toX - 10, sp.toY - 30);
          spellEffects.splice(i, 1);
        }
      });

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    /* =========================================================
       5. SISTEMA DE DIÁLOGO E INTERAÇÕES ACADÊMICAS
       ========================================================= */
    function openNpcDialogue(n) {
      document.getElementById("npcTitle").innerText = n.name.toUpperCase();
      document.getElementById("npcRole").innerText = n.role;
      document.getElementById("npcIcon").innerText = n.icon;
      document.getElementById("npcDialogueText").innerHTML = `
        <p style="margin-bottom:8px;">${n.dialogue}</p>
        <p style="font-weight:700; color:var(--gold);">${n.challenge.q}</p>
      `;

      const optsBox = document.getElementById("npcChoices");
      optsBox.innerHTML = "";

      n.challenge.opts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-quest-choice";
        btn.innerText = opt.t;
        btn.onclick = () => {
          if (opt.ok) {
            logChat("LOOT", `Missão cumprida! +150 XP acadêmico!`);
            player.xp += 150;
            if (player.xp >= player.maxXp) {
              player.level++; player.xp = 0;
            }
            updateHud();
            document.getElementById("npcDialogueText").innerHTML = `
              <p style="color:var(--exp); font-weight:700;">🌟 CONCEITO ASSIMILADO COM SUCESSO!</p>
              <p style="margin-top:6px;">${opt.exp}</p>
            `;
            optsBox.innerHTML = "";
          } else {
            logChat("SISTEMA", "Falha conceitual! Tente novamente.");
            document.getElementById("npcDialogueText").innerHTML = `
              <p style="color:var(--hp); font-weight:700;">⚠️ PREMISSA INCORRETA!</p>
              <p style="margin-top:6px;">${opt.exp}</p>
            `;
          }
        };
        optsBox.appendChild(btn);
      });

      document.getElementById("questDialogue").classList.add("open");
    }

    function closeDialogue() {
      document.getElementById("questDialogue").classList.remove("open");
    }

    function updateHud() {
      document.getElementById("player-lvl").innerText = `LVL ${player.level}`;
      document.getElementById("hp-bar").style.width = `${(player.hp / player.maxHp) * 100}%`;
      document.getElementById("mp-bar").style.width = `${(player.mp / player.maxMp) * 100}%`;
      document.getElementById("xp-bar").style.width = `${(player.xp / player.maxXp) * 100}%`;
    }

    function logChat(author, text) {
      const box = document.getElementById("mmo-chat");
      const r = document.createElement("div");
      r.className = "chat-row";
      if (author === "LOOT") r.innerHTML = `<span class="chat-loot">[RECOMPENSA]:</span> ${text}`;
      else if (author === "SERVER") r.innerHTML = `<span class="chat-server">[SERVIDOR]:</span> ${text}`;
      else r.innerHTML = `<span class="chat-author">${author}:</span> ${text}`;
      box.appendChild(r);
      box.scrollTop = box.scrollHeight;
    }

    // Inicialização
    updateHud();
    gameLoop();
  </script>
</body>
