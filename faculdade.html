<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Siliconia Online: Kernel MMORPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #05050a;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 600px;
      max-height: 850px;
      background: #000;
      overflow: hidden;
      border: 2px solid #312e81;
    }

    canvas#worldCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* HUD SUPERIOR DE MMORPG */
    .mmo-hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .player-plate {
      background: rgba(10, 12, 28, 0.85);
      border: 2px solid #6366f1;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 160px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }

    .plate-title {
      font-size: 8px;
      color: #fbbf24;
      display: flex;
      justify-content: space-between;
    }

    .bar-bg {
      height: 7px;
      background: #1e1b4b;
      border: 1px solid #4338ca;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-hp { height: 100%; background: #ef4444; width: 100%; transition: width 0.2s; }
    .bar-mp { height: 100%; background: #06b6d4; width: 100%; transition: width 0.2s; }
    .bar-xp { height: 100%; background: #10b981; width: 0%; transition: width 0.2s; }

    .online-count {
      background: rgba(10, 12, 28, 0.85);
      border: 1.5px solid #10b981;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 7px;
      color: #10b981;
    }

    /* MINI CHAT FLUTUANTE DE MMO */
    .chat-bubble-stream {
      position: absolute;
      bottom: 120px;
      left: 10px;
      width: 220px;
      height: 70px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 4px;
      pointer-events: none;
      z-index: 10;
    }

    .chat-line {
      background: rgba(0,0,0,0.65);
      border-left: 3px solid #8b5cf6;
      padding: 3px 6px;
      font-size: 7px;
      color: #e2e8f0;
      border-radius: 0 4px 4px 0;
      line-height: 1.3;
      text-shadow: 1px 1px 0 #000;
    }

    /* CONTROLES TOUCH EMBUTIDOS (JOYSTICK & SKILLS) */
    .controls-layer {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 20;
    }

    .dpad-touch {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 3px;
      pointer-events: auto;
    }

    .dpad-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 2px solid #6366f1;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .dpad-btn:active {
      background: #8b5cf6;
      transform: scale(0.92);
    }

    .action-touch {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .btn-action-round {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      border: 2.5px solid #fbbf24;
      color: #fbbf24;
      font-size: 8px;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
      cursor: pointer;
    }
    .btn-action-round:active {
      transform: scale(0.9);
      background: #fbbf24;
      color: #000;
    }

    .btn-spell {
      border-color: #a855f7;
      color: #a855f7;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }
    .btn-spell:active {
      background: #a855f7;
      color: #000;
    }

    /* CAIXA DE DIÁLOGO DE NPC (ZELDA / POKÉMON STYLE) */
    .dialogue-box {
      display: none;
      position: absolute;
      bottom: 90px;
      left: 12px;
      right: 12px;
      background: rgba(10, 12, 28, 0.95);
      border: 3px solid #fbbf24;
      border-radius: 8px;
      padding: 12px;
      z-index: 50;
      box-shadow: 0 0 20px rgba(0,0,0,0.9);
      flex-direction: column;
      gap: 8px;
    }
    .dialogue-box.active { display: flex; }

    .speaker-name { font-size: 9px; color: #fbbf24; }
    .speaker-text { font-size: 8px; line-height: 1.6; color: #f8fafc; }
    .dialogue-next {
      align-self: flex-end;
      font-size: 7px;
      color: #8b5cf6;
      animation: blink 1s infinite;
      cursor: pointer;
      padding: 4px;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="worldCanvas" width="360" height="480"></canvas>

    <!-- HUD SUPERIOR -->
    <div class="mmo-hud">
      <div class="player-plate">
        <div class="plate-title">
          <span>AMANDA</span>
          <span id="txt-lvl">LV.1</span>
        </div>
        <div class="bar-bg"><div class="bar-hp" id="bar-hp"></div></div>
        <div class="bar-bg"><div class="bar-mp" id="bar-mp"></div></div>
        <div class="bar-bg"><div class="bar-xp" id="bar-xp"></div></div>
      </div>
      <div class="online-count">🟢 4 PLAYERS ON</div>
    </div>

    <!-- CHAT EM TEMPO REAL -->
    <div class="chat-bubble-stream" id="chat-stream">
      <div class="chat-line">[SERVER]: Bem-vinda a Siliconia!</div>
    </div>

    <!-- DIÁLOGO COM NPCS -->
    <div class="dialogue-box" id="dialogueBox">
      <div class="speaker-name" id="diagSpeaker">NPC</div>
      <div class="speaker-text" id="diagText">Texto de diálogo aqui...</div>
      <div class="dialogue-next" onclick="advanceDialogue()">[AVANÇAR ▶]</div>
    </div>

    <!-- CONTROLES MOBILE -->
    <div class="controls-layer">
      <!-- D-Pad Direcional -->
      <div class="dpad-touch">
        <div></div>
        <div class="dpad-btn" id="btn-up">▲</div>
        <div></div>
        <div class="dpad-btn" id="btn-left">◀</div>
        <div></div>
        <div class="dpad-btn" id="btn-right">▶</div>
        <div></div>
        <div class="dpad-btn" id="btn-down">▼</div>
        <div></div>
      </div>

      <!-- Botões de Ação -->
      <div class="action-touch">
        <button class="btn-action-round btn-spell" id="btn-magic" onclick="triggerMagic()">
          <span>🔮</span>
          <span>FREE()</span>
        </button>
        <button class="btn-action-round" id="btn-attack" onclick="triggerInteract()">
          <span>⚔️</span>
          <span>ATK/A</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       ENGINE DO MMORPG 2D EM PIXEL ART
       ========================================================= */
    const canvas = document.getElementById("worldCanvas");
    const ctx = canvas.getContext("2d");

    // Dimensões Virtuais da Resolução Retro (Pixel Art Nativo)
    const V_WIDTH = 360;
    const V_HEIGHT = 480;

    // Tamanho do Mundo em Tiles (32x32 tiles, cada tile = 32px)
    const TILE_SIZE = 32;
    const MAP_COLS = 30;
    const MAP_ROWS = 30;

    // Estado da Amanda
    const player = {
      x: 15 * TILE_SIZE,
      y: 15 * TILE_SIZE,
      speed: 3,
      dir: 'down',
      isMoving: false,
      frame: 0,
      hp: 100,
      maxHp: 100,
      mp: 60,
      maxMp: 60,
      xp: 0,
      maxXp: 100,
      lvl: 1
    };

    // Outros Players Simulados (Co-op no mapa)
    const onlinePlayers = [
      { name: "Linus_99", x: 17 * TILE_SIZE, y: 14 * TILE_SIZE, color: "#38bdf8", dir: 'down', frame: 0 },
      { name: "Ada_Dev", x: 13 * TILE_SIZE, y: 16 * TILE_SIZE, color: "#f472b6", dir: 'down', frame: 0 },
      { name: "Turing_K", x: 16 * TILE_SIZE, y: 18 * TILE_SIZE, color: "#4ade80", dir: 'down', frame: 0 }
    ];

    // NPCs Acadêmicos
    const npcs = [
      {
        id: "ritchie",
        name: "Mestre Dennis Ritchie",
        x: 12 * TILE_SIZE,
        y: 12 * TILE_SIZE,
        color: "#fbbf24",
        dialogues: [
          "Amanda! O reino de C está sofrendo vazamento na Heap!",
          "Lembre-se: para acessar o valor físico de 'int *p', use '*p'.",
          "E NUNCA esqueça de chamar free() após malloc() para evitar Leaks!"
        ],
        curDiag: 0
      },
      {
        id: "tanenbaum",
        name: "Guardião Tanenbaum",
        x: 18 * TILE_SIZE,
        y: 12 * TILE_SIZE,
        color: "#a855f7",
        dialogues: [
          "Atenção aos registradores Base e Limite da CPU!",
          "Se um processo tentar acessar fora do limite, um Trap de proteção é disparado.",
          "Derrote os monstros de Fragmentação com a habilidade FREE()!"
        ],
        curDiag: 0
      }
    ];

    // Monstros do Mapa (Spawn de Bugs de Memória)
    let monsters = [
      { id: 1, name: "SegFault Bug", x: 14 * TILE_SIZE, y: 8 * TILE_SIZE, hp: 50, maxHp: 50, type: "bug" },
      { id: 2, name: "Memory Leak", x: 8 * TILE_SIZE, y: 14 * TILE_SIZE, hp: 60, maxHp: 60, type: "leak" },
      { id: 3, name: "Page Fault Daemon", x: 20 * TILE_SIZE, y: 16 * TILE_SIZE, hp: 70, maxHp: 70, type: "page" }
    ];

    // Efeitos de Dano Flutuante e Magias
    let floatingTexts = [];
    let magicBursts = [];

    // Controles Ativos
    const keys = { up: false, down: false, left: false, right: false };

    // Eventos do Teclado (Desktop)
    window.addEventListener("keydown", e => {
      if (e.key === "w" || e.key === "ArrowUp") keys.up = true;
      if (e.key === "s" || e.key === "ArrowDown") keys.down = true;
      if (e.key === "a" || e.key === "ArrowLeft") keys.left = true;
      if (e.key === "d" || e.key === "ArrowRight") keys.right = true;
      if (e.key === " ") triggerInteract();
      if (e.key === "1" || e.key === "q") triggerMagic();
    });

    window.addEventListener("keyup", e => {
      if (e.key === "w" || e.key === "ArrowUp") keys.up = false;
      if (e.key === "s" || e.key === "ArrowDown") keys.down = false;
      if (e.key === "a" || e.key === "ArrowLeft") keys.left = false;
      if (e.key === "d" || e.key === "ArrowRight") keys.right = false;
    });

    // Touch D-Pad (Mobile)
    function setupTouchBtn(id, keyName) {
      const el = document.getElementById(id);
      el.addEventListener("pointerdown", e => { e.preventDefault(); keys[keyName] = true; });
      el.addEventListener("pointerup", e => { e.preventDefault(); keys[keyName] = false; });
      el.addEventListener("pointerleave", e => { e.preventDefault(); keys[keyName] = false; });
    }
    setupTouchBtn("btn-up", "up");
    setupTouchBtn("btn-down", "down");
    setupTouchBtn("btn-left", "left");
    setupTouchBtn("btn-right", "right");

    /* =========================================================
       COMBATE, DIÁLOGOS E MAGIAS
       ========================================================= */
    let activeDialogueNpc = null;

    function triggerInteract() {
      // 1. Verifica se está perto de um NPC para conversar
      for (let n of npcs) {
        if (Math.hypot(player.x - n.x, player.y - n.y) < 45) {
          openDialogue(n);
          return;
        }
      }

      // 2. Ataque corpo a corpo no monstro mais próximo
      for (let m of monsters) {
        if (Math.hypot(player.x - m.x, player.y - m.y) < 45) {
          const dmg = 25;
          m.hp -= dmg;
          spawnFloatText(m.x, m.y - 10, `-${dmg}`, "#ef4444");

          if (m.hp <= 0) {
            defeatMonster(m);
          }
          return;
        }
      }
    }

    function triggerMagic() {
      if (player.mp < 20) {
        addChat("[MP BAIXO]: Descanse para regenerar!");
        return;
      }
      player.mp -= 20;
      updateHudBars();

      // Causa explosão de área (FREE de memória)
      magicBursts.push({ x: player.x, y: player.y, radius: 10, maxRadius: 65, alpha: 1 });

      monsters.forEach(m => {
        if (Math.hypot(player.x - m.x, player.y - m.y) < 70) {
          const dmg = 45;
          m.hp -= dmg;
          spawnFloatText(m.x, m.y - 12, `FREE! -${dmg}`, "#c084fc");
          if (m.hp <= 0) defeatMonster(m);
        }
      });
    }

    function defeatMonster(m) {
      spawnFloatText(m.x, m.y - 20, "+50 XP (INODE)", "#10b981");
      addChat(`[LOOT]: ${m.name} purificado! +50 XP`);
      player.xp += 50;

      if (player.xp >= player.maxXp) {
        player.lvl++;
        player.xp = 0;
        player.maxHp += 20; player.hp = player.maxHp;
        player.maxMp += 20; player.mp = player.maxMp;
        document.getElementById("txt-lvl").innerText = `LV.${player.lvl}`;
        addChat(`[LEVEL UP!]: Amanda alcançou o Nível ${player.lvl}!`);
      }
      updateHudBars();

      // Remove e respawna em outro local após 5s
      monsters = monsters.filter(item => item.id !== m.id);
      setTimeout(() => {
        monsters.push({
          id: m.id,
          name: m.name,
          x: (10 + Math.random() * 10) * TILE_SIZE,
          y: (10 + Math.random() * 10) * TILE_SIZE,
          hp: m.maxHp,
          maxHp: m.maxHp,
          type: m.type
        });
      }, 5000);
    }

    function openDialogue(n) {
      activeDialogueNpc = n;
      document.getElementById("diagSpeaker").innerText = n.name.toUpperCase();
      document.getElementById("diagText").innerText = n.dialogues[n.curDiag];
      document.getElementById("dialogueBox").classList.add("active");
    }

    function advanceDialogue() {
      if (!activeDialogueNpc) return;
      activeDialogueNpc.curDiag++;
      if (activeDialogueNpc.curDiag >= activeDialogueNpc.dialogues.length) {
        activeDialogueNpc.curDiag = 0;
        document.getElementById("dialogueBox").classList.remove("active");
        activeDialogueNpc = null;
      } else {
        document.getElementById("diagText").innerText = activeDialogueNpc.dialogues[activeDialogueNpc.curDiag];
      }
    }

    function spawnFloatText(x, y, text, color) {
      floatingTexts.push({ x, y, text, color, life: 30 });
    }

    function addChat(txt) {
      const box = document.getElementById("chat-stream");
      const d = document.createElement("div");
      d.className = "chat-line";
      d.innerText = txt;
      box.appendChild(d);
      if (box.children.length > 4) box.removeChild(box.children[0]);
    }

    function updateHudBars() {
      document.getElementById("bar-hp").style.width = `${(player.hp / player.maxHp) * 100}%`;
      document.getElementById("bar-mp").style.width = `${(player.mp / player.maxMp) * 100}%`;
      document.getElementById("bar-xp").style.width = `${(player.xp / player.maxXp) * 100}%`;
    }

    /* =========================================================
       LOOP PRINCIPAL DO JOGO (RENDERIZAÇÃO & CÂMERA)
       ========================================================= */
    let animTimer = 0;

    function update() {
      animTimer++;
      player.isMoving = false;

      // Movimentação do Jogador
      if (keys.up) { player.y -= player.speed; player.dir = 'up'; player.isMoving = true; }
      if (keys.down) { player.y += player.speed; player.dir = 'down'; player.isMoving = true; }
      if (keys.left) { player.x -= player.speed; player.dir = 'left'; player.isMoving = true; }
      if (keys.right) { player.x += player.speed; player.dir = 'right'; player.isMoving = true; }

      // Limites do Mundo
      player.x = Math.max(TILE_SIZE, Math.min((MAP_COLS - 2) * TILE_SIZE, player.x));
      player.y = Math.max(TILE_SIZE, Math.min((MAP_ROWS - 2) * TILE_SIZE, player.y));

      if (player.isMoving && animTimer % 8 === 0) {
        player.frame = (player.frame + 1) % 4;
      }

      // Regeneração de MP
      if (player.mp < player.maxMp && animTimer % 60 === 0) {
        player.mp = Math.min(player.maxMp, player.mp + 5);
        updateHudBars();
      }

      // IA dos outros jogadores simulados
      onlinePlayers.forEach(p => {
        if (Math.random() < 0.03) {
          p.x += (Math.random() * 20 - 10);
          p.y += (Math.random() * 20 - 10);
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      // Câmera Centralizada na Amanda
      const camX = Math.floor(V_WIDTH / 2 - player.x);
      const camY = Math.floor(V_HEIGHT / 2 - player.y);

      ctx.save();
      ctx.translate(camX, camY);

      // 1. DESENHO DO TERRENO EM TILES (GRAMA & RUAS DE CIRCUITO)
      for (let c = 0; c < MAP_COLS; c++) {
        for (let r = 0; r < MAP_ROWS; r++) {
          const posX = c * TILE_SIZE;
          const posY = r * TILE_SIZE;

          // Borda do Mapa
          if (c === 0 || c === MAP_COLS - 1 || r === 0 || r === MAP_ROWS - 1) {
            ctx.fillStyle = "#1e1b4b"; // Muralha de Silício
          } else if (c % 5 === 0 || r % 5 === 0) {
            ctx.fillStyle = "#0f172a"; // Trilhas de Barramento
          } else {
            ctx.fillStyle = "#064e3b"; // Gramado de Código
          }
          ctx.fillRect(posX, posY, TILE_SIZE, TILE_SIZE);

          // Grade fina retrô
          ctx.strokeStyle = "rgba(255,255,255,0.03)";
          ctx.strokeRect(posX, posY, TILE_SIZE, TILE_SIZE);
        }
      }

      // 2. DESENHO DOS NPCS EM PIXEL ART
      npcs.forEach(n => {
        // Corpo do NPC
        ctx.fillStyle = n.color;
        ctx.fillRect(n.x - 10, n.y - 14, 20, 24);
        // Cabeça
        ctx.fillStyle = "#fde047";
        ctx.fillRect(n.x - 7, n.y - 24, 14, 12);
        // Ícone Flutuante '?'
        ctx.fillStyle = "#fbbf24";
        ctx.font = "8px 'Press Start 2P'";
        ctx.fillText("?", n.x - 4, n.y - 30);
        // Nome
        ctx.fillStyle = "#fff";
        ctx.font = "6px 'Press Start 2P'";
        ctx.fillText(n.name.split(" ")[0], n.x - 14, n.y + 18);
      });

      // 3. DESENHO DOS MONSTROS
      monsters.forEach(m => {
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(m.x - 12, m.y - 12, 24, 24);
        // Olhos do Monstro
        ctx.fillStyle = "#000";
        ctx.fillRect(m.x - 6, m.y - 6, 4, 4);
        ctx.fillRect(m.x + 2, m.y - 6, 4, 4);
        // Barra de Vida
        ctx.fillStyle = "#000";
        ctx.fillRect(m.x - 14, m.y - 20, 28, 4);
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(m.x - 14, m.y - 20, (m.hp / m.maxHp) * 28, 4);
      });

      // 4. OUTROS PLAYERS
      onlinePlayers.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 8, p.y - 12, 16, 20);
        ctx.fillStyle = "#fde047";
        ctx.fillRect(p.x - 6, p.y - 20, 12, 10);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "6px 'Press Start 2P'";
        ctx.fillText(p.name, p.x - 16, p.y + 16);
      });

      // 5. AMANDA (SPRITE EM PIXEL ART COM ANIMAÇÃO DE PASSOS)
      ctx.fillStyle = "#a855f7"; // Túnica Roxa Borahae
      ctx.fillRect(player.x - 9, player.y - 12 + (player.isMoving ? (player.frame % 2) * 2 : 0), 18, 20);
      // Cabeça / Rosto
      ctx.fillStyle = "#fed7aa";
      ctx.fillRect(player.x - 7, player.y - 22, 14, 12);
      // Cabelo
      ctx.fillStyle = "#1e1b4b";
      ctx.fillRect(player.x - 8, player.y - 25, 16, 6);
      // Olhos
      ctx.fillStyle = "#000";
      ctx.fillRect(player.x - 4, player.y - 18, 2, 2);
      ctx.fillRect(player.x + 2, player.y - 18, 2, 2);

      // Nome da Amanda
      ctx.fillStyle = "#fbbf24";
      ctx.font = "7px 'Press Start 2P'";
      ctx.fillText("AMANDA", player.x - 20, player.y - 29);

      // 6. EFEITOS DE MAGIA E DANO FLUTUANTE
      magicBursts.forEach((mb, idx) => {
        mb.radius += 4;
        mb.alpha -= 0.05;
        ctx.strokeStyle = `rgba(168, 85, 247, ${Math.max(0, mb.alpha)})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(mb.x, mb.y, mb.radius, 0, Math.PI * 2);
        ctx.stroke();
        if (mb.alpha <= 0) magicBursts.splice(idx, 1);
      });

      floatingTexts.forEach((ft, idx) => {
        ft.y -= 0.8;
        ft.life--;
        ctx.fillStyle = ft.color;
        ctx.font = "7px 'Press Start 2P'";
        ctx.fillText(ft.text, ft.x - 10, ft.y);
        if (ft.life <= 0) floatingTexts.splice(idx, 1);
      });

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Inicialização
    updateHudBars();
    gameLoop();
  </script>
